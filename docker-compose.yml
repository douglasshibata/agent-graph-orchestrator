services:
  agent-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-graph-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
